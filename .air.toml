root = "."
tmp_dir = "tmp"

[build]
  cmd = "env GOMODCACHE=/tmp/gomodcache GOCACHE=/tmp/gocache go build -o ./tmp/api ./cmd/api"
  bin = "tmp/api"
  delay = 1000
  include_ext = ["go", "sql", "env"]
  exclude_dir = ["tmp", "vendor", ".git"]
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
