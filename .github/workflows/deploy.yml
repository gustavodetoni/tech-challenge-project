name: Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Acao da aplicacao"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy
      environment:
        description: "Ambiente"
        required: true
        default: "homolog"
        type: choice
        options:
          - homolog
          - prod
      image_tag:
        description: "Tag da imagem Docker publicada"
        required: true
        default: "latest"
        type: string
      cluster_name:
        description: "Nome do cluster EKS. Se vazio, usa tech-challenge-<ambiente>-eks."
        required: false
        type: string
      run_migrations:
        description: "Executar migrations antes do rollout"
        required: true
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
  # Deploy automatico futuro:
  # push:
  #   branches:
  #     - homolog
  #     - main

env:
  AWS_REGION: us-east-1
  K8S_NAMESPACE: tech-challenge
  K8S_DEPLOYMENT: tech-challenge-api
  K8S_CONTAINER: api
  DOCKER_IMAGE: docker.io/gustavodetoni/tech-challenge-project

permissions:
  contents: read

concurrency:
  group: deploy-app-${{ inputs.environment }}-${{ inputs.action }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply Application
    if: ${{ inputs.action == 'apply' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || 'homolog' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate required secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID" || (echo "AWS_ACCESS_KEY_ID secret is required." && exit 1)
          test -n "$AWS_SECRET_ACCESS_KEY" || (echo "AWS_SECRET_ACCESS_KEY secret is required." && exit 1)
          test -n "$AWS_SESSION_TOKEN" || (echo "AWS_SESSION_TOKEN secret is required for AWS Academy." && exit 1)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Resolve cluster name
        id: cluster
        run: |
          cluster_name="${{ inputs.cluster_name }}"
          if [ -z "$cluster_name" ]; then
            cluster_name="tech-challenge-${{ inputs.environment }}-eks"
          fi
          echo "name=$cluster_name" >> "$GITHUB_OUTPUT"

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "${{ steps.cluster.outputs.name }}"

      - name: Validate Kubernetes deployment exists
        run: kubectl get deployment "$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE"

      - name: Run database migrations
        if: ${{ inputs.run_migrations == 'yes' }}
        run: |
          kubectl delete job tech-challenge-db-deploy -n "$K8S_NAMESPACE" --ignore-not-found
          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: tech-challenge-db-deploy
            namespace: $K8S_NAMESPACE
          spec:
            backoffLimit: 2
            activeDeadlineSeconds: 1200
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: db-deploy
                    image: $DOCKER_IMAGE:${{ inputs.image_tag }}
                    command:
                      - /seed
                    envFrom:
                      - configMapRef:
                          name: tech-challenge-api-config
                      - secretRef:
                          name: tech-challenge-api-secret
                    env:
                      - name: SEED_ENABLED
                        value: "false"
          EOF
          kubectl wait --for=condition=complete \
            job/tech-challenge-db-deploy \
            -n "$K8S_NAMESPACE" \
            --timeout=1200s
          kubectl logs -n "$K8S_NAMESPACE" -l job-name=tech-challenge-db-deploy --all-containers --tail=-1

      - name: Update application image
        run: |
          kubectl set image deployment/"$K8S_DEPLOYMENT" \
            "$K8S_CONTAINER=$DOCKER_IMAGE:${{ inputs.image_tag }}" \
            -n "$K8S_NAMESPACE"

      - name: Wait for rollout
        run: kubectl rollout status deployment/"$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" --timeout=300s

      - name: Print deployment summary
        run: |
          {
            echo "## Application deploy"
            echo ""
            echo "- Environment: ${{ inputs.environment }}"
            echo "- Cluster: ${{ steps.cluster.outputs.name }}"
            echo "- Namespace: $K8S_NAMESPACE"
            echo "- Deployment: $K8S_DEPLOYMENT"
            echo "- Image: $DOCKER_IMAGE:${{ inputs.image_tag }}"
          } >> "$GITHUB_STEP_SUMMARY"

  destroy:
    name: Destroy Application
    if: ${{ inputs.action == 'destroy' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || 'homolog' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate required secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID" || (echo "AWS_ACCESS_KEY_ID secret is required." && exit 1)
          test -n "$AWS_SECRET_ACCESS_KEY" || (echo "AWS_SECRET_ACCESS_KEY secret is required." && exit 1)
          test -n "$AWS_SESSION_TOKEN" || (echo "AWS_SESSION_TOKEN secret is required for AWS Academy." && exit 1)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Resolve cluster name
        id: cluster
        run: |
          cluster_name="${{ inputs.cluster_name }}"
          if [ -z "$cluster_name" ]; then
            cluster_name="tech-challenge-${{ inputs.environment }}-eks"
          fi
          echo "name=$cluster_name" >> "$GITHUB_OUTPUT"

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "${{ steps.cluster.outputs.name }}"

      - name: Delete application resources
        run: |
          kubectl delete job tech-challenge-db-deploy -n "$K8S_NAMESPACE" --ignore-not-found
          kubectl delete deployment "$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" --ignore-not-found
          kubectl delete hpa "$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" --ignore-not-found
          kubectl delete service "$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" --ignore-not-found
          kubectl delete configmap tech-challenge-api-config -n "$K8S_NAMESPACE" --ignore-not-found
          kubectl delete secret tech-challenge-api-secret -n "$K8S_NAMESPACE" --ignore-not-found
          kubectl delete serviceaccount tech-challenge-api -n "$K8S_NAMESPACE" --ignore-not-found

      - name: Print destroy summary
        run: |
          {
            echo "## Application destroy"
            echo ""
            echo "- Environment: ${{ inputs.environment }}"
            echo "- Cluster: ${{ steps.cluster.outputs.name }}"
            echo "- Namespace: $K8S_NAMESPACE"
          } >> "$GITHUB_STEP_SUMMARY"
