name: Release

on:
  workflow_run:
    workflows:
      - Sonar
    types:
      - completed

permissions:
  contents: write
  # packages: write

jobs:
  release:
    name: Create release from version.go
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check current main commit
        id: current-main
        run: |
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          workflow_sha="${{ github.event.workflow_run.head_sha }}"

          if [ "$current_main" != "$workflow_sha" ]; then
            echo "Skipping release. Workflow SHA $workflow_sha is not current origin/main $current_main."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        if: steps.current-main.outputs.should_release == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download dependencies
        if: steps.current-main.outputs.should_release == 'true'
        run: go mod download

      - name: Run tests with coverage
        if: steps.current-main.outputs.should_release == 'true'
        run: make tests

      - name: Read version
        if: steps.current-main.outputs.should_release == 'true'
        id: version
        run: |
          version="$(sed -nE 's/^const[[:space:]]+Version[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' version.go)"
          if [ -z "$version" ]; then
            echo "::error::Version must be declared as: const Version = \"X.Y.Z\""
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        if: steps.current-main.outputs.should_release == 'true'
        run: |
          if git rev-parse --verify --quiet "refs/tags/${{ steps.version.outputs.tag }}"; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists. Update version.go before merging."
            exit 1
          fi

      - name: Log in to Docker Hub
        if: steps.current-main.outputs.should_release == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Docker image
        if: steps.current-main.outputs.should_release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tech-challenge-project:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/tech-challenge-project:latest

      - name: Create GitHub release
        if: steps.current-main.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          generate_release_notes: true
