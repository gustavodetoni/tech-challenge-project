services:
  os-postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: os_service, POSTGRES_USER: tech_challenge, POSTGRES_PASSWORD: tech_challenge}
    ports: ["5433:5432"]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U tech_challenge -d os_service"], interval: 3s, timeout: 3s, retries: 20}
  billing-postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: billing_service, POSTGRES_USER: tech_challenge, POSTGRES_PASSWORD: tech_challenge}
    ports: ["5434:5432"]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U tech_challenge -d billing_service"], interval: 3s, timeout: 3s, retries: 20}
  mongodb:
    image: mongo:8
    ports: ["27017:27017"]
    healthcheck: {test: [CMD-SHELL, "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"], interval: 5s, timeout: 5s, retries: 20}
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck: {test: [CMD, rabbitmq-diagnostics, -q, ping], interval: 5s, timeout: 5s, retries: 20}
  os-service:
    build: ../tech-challenge-os-service
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://tech_challenge:tech_challenge@os-postgres:5432/os_service?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports: ["8081:8081"]
    depends_on: {os-postgres: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}
  billing-service:
    build: ../tech-challenge-billing-service
    environment:
      PORT: "8082"
      DATABASE_URL: postgres://tech_challenge:tech_challenge@billing-postgres:5432/billing_service?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-}
    ports: ["8082:8082"]
    depends_on: {billing-postgres: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}
  execution-service:
    build: ../tech-challenge-execution-service
    environment: {PORT: "8083", MONGODB_URL: mongodb://mongodb:27017, MONGODB_DATABASE: execution_service, RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/}
    ports: ["8083:8083"]
    depends_on: {mongodb: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}
