services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tech_challenge}
      POSTGRES_USER: ${POSTGRES_USER:-tech_challenge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tech_challenge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tech_challenge} -d ${POSTGRES_DB:-tech_challenge}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-tech_challenge}:${POSTGRES_PASSWORD:-tech_challenge}@postgres:5432/${POSTGRES_DB:-tech_challenge}?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_ISSUER: ${JWT_ISSUER:-tech-challenge-project}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-10}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-20}
      RATE_LIMIT_TTL_SECONDS: ${RATE_LIMIT_TTL_SECONDS:-600}
      RATE_LIMIT_CLEANUP_INTERVAL_SECONDS: ${RATE_LIMIT_CLEANUP_INTERVAL_SECONDS:-60}
      GIN_MODE: ${GIN_MODE:-release}
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
