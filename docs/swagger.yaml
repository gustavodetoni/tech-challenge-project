basePath: /
definitions:
  controllers.adjustStockRequest:
    properties:
      movement_type:
        type: string
      notes:
        type: string
      quantity:
        type: integer
    required:
    - movement_type
    - quantity
    type: object
  controllers.authResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      role:
        type: string
      token_type:
        type: string
      user_id:
        type: string
    type: object
  controllers.avgExecutionResponse:
    properties:
      average_minutes:
        type: number
    type: object
  controllers.clientResponse:
    properties:
      document_number:
        type: string
      document_type:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      phone:
        type: string
    type: object
  controllers.createClientRequest:
    properties:
      document_number:
        type: string
      document_type:
        type: string
      email:
        type: string
      name:
        type: string
      phone:
        type: string
    required:
    - document_number
    - document_type
    - name
    type: object
  controllers.createPartRequest:
    properties:
      active:
        type: boolean
      description:
        type: string
      name:
        type: string
      sku:
        type: string
      stock_quantity:
        type: integer
      unit_price_cents:
        type: integer
    required:
    - name
    - sku
    type: object
  controllers.createServiceRequest:
    properties:
      active:
        type: boolean
      base_price_cents:
        type: integer
      description:
        type: string
      estimated_minutes:
        type: integer
      name:
        type: string
    required:
    - name
    type: object
  controllers.createVehicleRequest:
    properties:
      brand:
        type: string
      chassis:
        type: string
      color:
        type: string
      manufacture_year:
        type: integer
      mileage:
        type: integer
      model:
        type: string
      model_year:
        type: integer
      notes:
        type: string
      plate:
        type: string
    required:
    - brand
    - model
    - model_year
    - plate
    type: object
  controllers.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  controllers.meResponse:
    properties:
      email:
        type: string
      expires_at:
        type: string
      id:
        type: string
      issued_at:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
  controllers.partResponse:
    properties:
      active:
        type: boolean
      description:
        type: string
      id:
        type: string
      name:
        type: string
      sku:
        type: string
      stock_quantity:
        type: integer
      unit_price_cents:
        type: integer
    type: object
  controllers.registerRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    required:
    - email
    - name
    - password
    type: object
  controllers.serviceOrderDetailResponse:
    properties:
      client_id:
        type: string
      code:
        type: string
      id:
        type: string
      opened_at:
        type: string
      status:
        type: string
      vehicle_id:
        type: string
    type: object
  controllers.serviceOrderSummaryResponse:
    properties:
      client_id:
        type: string
      client_name:
        type: string
      code:
        type: string
      id:
        type: string
      opened_at:
        type: string
      plate:
        type: string
      status:
        type: string
      vehicle_id:
        type: string
    type: object
  controllers.serviceResponse:
    properties:
      active:
        type: boolean
      base_price_cents:
        type: integer
      description:
        type: string
      estimated_minutes:
        type: integer
      id:
        type: string
      name:
        type: string
    type: object
  controllers.vehicleResponse:
    properties:
      brand:
        type: string
      chassis:
        type: string
      client_id:
        type: string
      color:
        type: string
      id:
        type: string
      manufacture_year:
        type: integer
      mileage:
        type: integer
      model:
        type: string
      model_year:
        type: integer
      notes:
        type: string
      plate:
        type: string
    type: object
