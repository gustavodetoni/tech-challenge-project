basePath: /
definitions:
  controllers.approveBudgetRequest:
    properties:
      approved_by_name:
        type: string
    type: object
  controllers.authResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      role:
        type: string
      token_type:
        type: string
      user_id:
        type: string
    type: object
  controllers.avgExecutionResponse:
    properties:
      average_minutes:
        type: number
    type: object
  controllers.clientServiceOrderResponse:
    properties:
      budget_status:
        type: string
      budget_total_cents:
        type: integer
      code:
        type: string
      opened_at:
        type: string
      status:
        type: string
    type: object
  controllers.createServiceOrderRequest:
    properties:
      client_document_number:
        type: string
      client_document_type:
        type: string
      client_email:
        type: string
      client_name:
        type: string
      client_phone:
        type: string
      customer_complaint:
        type: string
      parts:
        items:
          $ref: '#/definitions/serviceorder.ItemInput'
        type: array
      services:
        items:
          $ref: '#/definitions/serviceorder.ItemInput'
        type: array
      vehicle_brand:
        type: string
      vehicle_color:
        type: string
      vehicle_manufacture_year:
        type: integer
      vehicle_model:
        type: string
      vehicle_model_year:
        type: integer
      vehicle_plate:
        type: string
    required:
    - client_document_number
    - client_document_type
    - client_name
    - vehicle_brand
    - vehicle_model
    - vehicle_model_year
    - vehicle_plate
    type: object
  controllers.createServiceOrderResponse:
    properties:
      budget_id:
        type: string
      budget_status:
        type: string
      code:
        type: string
      service_order_id:
        type: string
      total_cents:
        type: integer
    type: object
  controllers.meResponse:
    properties:
      email:
        type: string
      expires_at:
        type: string
      id:
        type: string
      issued_at:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
  controllers.registerRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    required:
    - email
    - name
    - password
    type: object
  controllers.rejectBudgetRequest:
    properties:
      reason:
        type: string
    required:
    - reason
    type: object
  controllers.serviceOrderDetailResponse:
    properties:
      client_id:
        type: string
      code:
        type: string
      id:
        type: string
      opened_at:
        type: string
      status:
        type: string
      vehicle_id:
        type: string
    type: object
  controllers.serviceOrderSummaryResponse:
    properties:
      client_id:
        type: string
      client_name:
        type: string
      code:
        type: string
      id:
        type: string
      opened_at:
        type: string
      plate:
        type: string
      status:
        type: string
      vehicle_id:
        type: string
    type: object
  dto.AdjustStockRequest:
    properties:
      movement_type:
        type: string
      notes:
        type: string
      quantity:
        type: integer
    required:
    - movement_type
    - quantity
    type: object
  dto.ClientResponse:
    properties:
      document_number:
        type: string
      document_type:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      phone:
        type: string
    type: object
  dto.CreateClientRequest:
    properties:
      document_number:
        type: string
      document_type:
        type: string
      email:
        type: string
      name:
        type: string
      phone:
        type: string
    required:
    - document_number
    - document_type
    - name
    type: object
  dto.CreatePartRequest:
    properties:
      active:
        type: boolean
      description:
        type: string
      name:
        type: string
      sku:
        type: string
      stock_quantity:
        type: integer
      unit_price_cents:
        type: integer
    required:
    - name
    - sku
    type: object
  dto.CreateServiceRequest:
    properties:
      active:
        type: boolean
      base_price_cents:
        type: integer
      description:
        type: string
      estimated_minutes:
        type: integer
      name:
        type: string
    required:
    - name
    type: object
  dto.CreateVehicleRequest:
    properties:
      brand:
        type: string
      chassis:
        type: string
      color:
        type: string
      manufacture_year:
        type: integer
      mileage:
        type: integer
      model:
        type: string
      model_year:
        type: integer
      notes:
        type: string
      plate:
        type: string
    required:
    - brand
    - model
    - model_year
    - plate
    type: object
  dto.PartResponse:
    properties:
      active:
        type: boolean
      description:
        type: string
      id:
        type: string
      name:
        type: string
      sku:
        type: string
      stock_quantity:
        type: integer
      unit_price_cents:
        type: integer
    type: object
  dto.ServiceResponse:
    properties:
      active:
        type: boolean
      base_price_cents:
        type: integer
      description:
        type: string
      estimated_minutes:
        type: integer
      id:
        type: string
      name:
        type: string
    type: object
  dto.VehicleResponse:
    properties:
      brand:
        type: string
      chassis:
        type: string
      client_id:
        type: string
      color:
        type: string
      id:
        type: string
      manufacture_year:
        type: integer
      mileage:
        type: integer
      model:
        type: string
      model_year:
        type: integer
      notes:
        type: string
      plate:
        type: string
    type: object
  serviceorder.ItemInput:
    properties:
      id:
        type: string
      quantity:
        type: integer
    type: object
info:
  contact: {}
  description: API for the Tech Challenge project.
  title: Tech Challenge API
  version: "1.0"
paths:
  /admin/clients:
    get:
      parameters:
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ClientResponse'
            type: array
      summary: List clients
      tags:
      - admin-clients
    post:
      parameters:
      - description: Client
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateClientRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ClientResponse'
      summary: Create client
      tags:
      - admin-clients
  /admin/clients/{id}:
    delete:
      parameters:
      - description: Client ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete client
      tags:
      - admin-clients
    get:
      parameters:
      - description: Client ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ClientResponse'
      summary: Get client
      tags:
      - admin-clients
    put:
      parameters:
      - description: Client ID
        in: path
        name: id
        required: true
        type: string
      - description: Client
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateClientRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ClientResponse'
      summary: Update client
      tags:
      - admin-clients
  /admin/clients/{id}/vehicles:
    get:
      parameters:
      - description: Client ID
        in: path
        name: id
        required: true
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.VehicleResponse'
            type: array
      summary: List vehicles by client
      tags:
      - admin-vehicles
    post:
      parameters:
      - description: Client ID
        in: path
        name: id
        required: true
        type: string
      - description: Vehicle
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateVehicleRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.VehicleResponse'
      summary: Create vehicle for client
      tags:
      - admin-vehicles
  /admin/metrics/avg-execution-time:
    get:
      parameters:
      - description: From (RFC3339)
        in: query
        name: from
        type: string
      - description: To (RFC3339)
        in: query
        name: to
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.avgExecutionResponse'
      summary: Average execution time (service orders)
      tags:
      - admin-metrics
  /admin/parts:
    get:
      parameters:
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.PartResponse'
            type: array
      summary: List parts and supplies
      tags:
      - admin-parts
    post:
      parameters:
      - description: Part
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePartRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.PartResponse'
      summary: Create part
      tags:
      - admin-parts
  /admin/parts/{id}:
    delete:
      parameters:
      - description: Part ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete part
      tags:
      - admin-parts
    get:
      parameters:
      - description: Part ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PartResponse'
      summary: Get part
      tags:
      - admin-parts
    put:
      parameters:
      - description: Part ID
        in: path
        name: id
        required: true
        type: string
      - description: Part
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePartRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PartResponse'
      summary: Update part
      tags:
      - admin-parts
  /admin/parts/{id}/stock-movements:
    post:
      parameters:
      - description: Part ID
        in: path
        name: id
        required: true
        type: string
      - description: Stock movement
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AdjustStockRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PartResponse'
      summary: Adjust part stock (creates stock movement)
      tags:
      - admin-parts
  /admin/service-orders:
    get:
      parameters:
      - description: Status
        in: query
        name: status
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/controllers.serviceOrderSummaryResponse'
            type: array
      security:
      - BearerAuth: []
      summary: List service orders
      tags:
      - admin-service-orders
    post:
      parameters:
      - description: Service order
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.createServiceOrderRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/controllers.createServiceOrderResponse'
      summary: Create service order (draft budget)
      tags:
      - admin-service-orders
  /admin/service-orders/{id}:
    get:
      parameters:
      - description: Service Order ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.serviceOrderDetailResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get service order
      tags:
      - admin-service-orders
  /admin/service-orders/{id}/budget/send:
    post:
      parameters:
      - description: Service Order ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Send budget for approval
      tags:
      - admin-service-orders
  /admin/service-orders/{id}/deliver:
    post:
      parameters:
      - description: Service Order ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Deliver service order
      tags:
      - admin-service-orders
  /admin/service-orders/{id}/diagnosis/start:
    post:
      parameters:
      - description: Service Order ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Start diagnosis
      tags:
      - admin-service-orders
  /admin/service-orders/{id}/finish:
    post:
      parameters:
      - description: Service Order ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Finish service order
      tags:
      - admin-service-orders
  /admin/services:
    get:
      parameters:
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ServiceResponse'
            type: array
      summary: List services
      tags:
      - admin-services
    post:
      parameters:
      - description: Service
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateServiceRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ServiceResponse'
      summary: Create service
      tags:
      - admin-services
  /admin/services/{id}:
    delete:
      parameters:
      - description: Service ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete service
      tags:
      - admin-services
    get:
      parameters:
      - description: Service ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ServiceResponse'
      summary: Get service
      tags:
      - admin-services
    put:
      parameters:
      - description: Service ID
        in: path
        name: id
        required: true
        type: string
      - description: Service
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateServiceRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ServiceResponse'
      summary: Update service
      tags:
      - admin-services
  /admin/vehicles/{id}:
    delete:
      parameters:
      - description: Vehicle ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete vehicle
      tags:
      - admin-vehicles
    get:
      parameters:
      - description: Vehicle ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.VehicleResponse'
      summary: Get vehicle
      tags:
      - admin-vehicles
    put:
      parameters:
      - description: Vehicle ID
        in: path
        name: id
        required: true
        type: string
      - description: Vehicle
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateVehicleRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.VehicleResponse'
      summary: Update vehicle
      tags:
      - admin-vehicles
  /auth/login:
    post:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.authResponse'
      summary: Login with email/password
      tags:
      - auth
  /auth/register:
    post:
      parameters:
      - description: Register request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.registerRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/controllers.authResponse'
      summary: Register a new user
      tags:
      - auth
  /client/service-orders/{code}:
    get:
      parameters:
      - description: CPF/CNPJ
        in: query
        name: document_number
        required: true
        type: string
      - description: Service Order Code
        in: path
        name: code
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.clientServiceOrderResponse'
      summary: Get service order progress (client)
      tags:
      - client-service-orders
  /client/service-orders/{code}/budget/approve:
    post:
      parameters:
      - description: CPF/CNPJ
        in: query
        name: document_number
        required: true
        type: string
      - description: Service Order Code
        in: path
        name: code
        required: true
        type: string
      - description: Approval info
        in: body
        name: request
        schema:
          $ref: '#/definitions/controllers.approveBudgetRequest'
      responses:
        "204":
          description: No Content
      summary: Approve latest budget
      tags:
      - client-service-orders
  /client/service-orders/{code}/budget/reject:
    post:
      parameters:
      - description: CPF/CNPJ
        in: query
        name: document_number
        required: true
        type: string
      - description: Service Order Code
        in: path
        name: code
        required: true
        type: string
      - description: Rejection reason
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.rejectBudgetRequest'
      responses:
        "204":
          description: No Content
      summary: Reject latest budget
      tags:
      - client-service-orders
  /health:
    get:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - system
  /me:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.meResponse'
      summary: Current identity
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    description: Type `Bearer ` followed by your JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
