apiVersion: v1
kind: ConfigMap
metadata:
  name: tech-challenge-api-config
  namespace: tech-challenge
  labels:
    app.kubernetes.io/name: tech-challenge-api
    app.kubernetes.io/component: api
data:
  PORT: "8080"
  GIN_MODE: "release"
  JWT_ISSUER: "tech-challenge-project"
  JWT_EXPIRY_MINUTES: "60"
  CORS_ENABLED: "true"
  CORS_ALLOW_CREDENTIALS: "false"
  CORS_ALLOWED_ORIGINS: ""
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_RPS: "10"
  RATE_LIMIT_BURST: "20"
  RATE_LIMIT_TTL_SECONDS: "600"
  RATE_LIMIT_CLEANUP_INTERVAL_SECONDS: "60"
  BREVO_SENDER_NAME: "Oficina - Pos"
