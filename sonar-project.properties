sonar.organization=gustavodetoni
sonar.projectKey=gustavodetoni_tech-challenge-project
sonar.projectName=tech-challenge-project

sonar.sources=cmd,internal,pkg
sonar.tests=internal/tests

sonar.exclusions=**/*_test.go,internal/tests/**,docs/**,k8s/**,infra/**,scripts/**,bin/**,tmp/**,vendor/**,.github/**,**/migrations/**,**/*.sql
