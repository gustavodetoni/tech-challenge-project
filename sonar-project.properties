sonar.coverage.exclusions=cmd/**,**/*_test.go,docs/**,k8s/**,infra/**,scripts/**,bin/**,tmp/**,vendor/**,.github/**,**/migrations/**,**/*.sql,**/mock*/**,**/*mock*.go,**/*_mock.go,**/*generated*.go,**/*_gen.go
